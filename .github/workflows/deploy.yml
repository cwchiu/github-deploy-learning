name: Deploy

on:
  workflow_dispatch

jobs:

  deploy-dev:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - run: echo "Deploy DEV"
      - run: |
          echo "ENV_NAME=${{ vars.ENV_NAME }}"
          echo "SECRET_VALUE=${{ secrets.SECRET_VALUE }}"

  deploy-uat:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: uat

    steps:
      - run: echo "Deploy UAT"
      - run: |
          echo "ENV_NAME=${{ vars.ENV_NAME }}"
          echo "SECRET_VALUE=${{ secrets.SECRET_VALUE }}"

  deploy-prod:
    needs: deploy-uat
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - run: echo "Deploy PROD"
      - run: |
          echo "ENV_NAME=${{ vars.ENV_NAME }}"
          echo "SECRET_VALUE=${{ secrets.SECRET_VALUE }}"