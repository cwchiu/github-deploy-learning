name: Build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Create Artifact
        run: |
          mkdir output
          echo "Build Time: $(date)" > output/build-info.txt
          echo "Commit: $GITHUB_SHA" >> output/build-info.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: output/
